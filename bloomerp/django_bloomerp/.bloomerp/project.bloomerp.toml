name="BloomERP"
description="The official BloomERP project"
schema_version=4

[environment]

[runtime]
bloomerp_version="1.15.27"
python_version="3.12"

[django]
installed_apps = ["bloomerp_modules", "debug_toolbar"]

[bloomerp.auth.api_key]
enabled = true

[bloomerp.auth.oauth]
enabled = true

[bloomerp]
email_secret_key="123"

[bloomerp.i18n]
languages = ["en", "nl", "fr", "de", "es", "it", "pt", "ru", "pl"]

[bloomerp.conferencing]
enabled = true
api_url = "http://localhost:7880"
public_url="ws://localhost:7880"
api_key="devkey"
api_secret="secret"
