<!-- Apply the persisted theme before styles and application JavaScript load. -->
<script>
    (() => {
        const storageKey = 'bloomerp_theme_preference';
        const allowedPreferences = ['light', 'dark', 'auto'];
        let preference = 'auto';

        try {
            const storedPreference = window.localStorage.getItem(storageKey);
            if (allowedPreferences.includes(storedPreference)) {
                preference = storedPreference;
            }
        } catch (_error) {
            // Storage can be unavailable in privacy-restricted browser contexts.
        }

        const isDark = preference === 'dark'
            || (preference === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
    })();
</script>
