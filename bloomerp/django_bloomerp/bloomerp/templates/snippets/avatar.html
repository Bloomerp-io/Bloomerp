{% load bloomerp %}
{% if avatar %}
    <img src="{{ avatar.url }}" class="{{ class_name }}" style="height:{{ size|avatar_size }}; width:{{ size|avatar_size }}; flex-shrink:0" alt="avatar">
{% else %}
    <div class="{{ class_name }} h-8 w-8 bg-primary-100 rounded-full flex justify-center items-center p-2" style="height:{{ size|avatar_size }}; width:{{ size|avatar_size }}; flex-shrink:0">
        <span class="text-md">{{ initials }}</span>
    </div>
{% endif %}
