{% load i18n %}
<div 
    bloomerp-component="foreign-field-widget" 
    data-filter-value-provider
    data-is-m2m="{{ widget.is_m2m|yesno:'true,false' }}"
    data-content-type-id="{{ content_type_id }}"
    data-choices-filter="{{ choices_filter_json }}"
    data-field-name="{{ widget.name }}"
    data-value="{{ selected_value }}"
    data-selected-ids='{{ selected_ids_json }}'
    data-selected-labels='{{ selected_labels_json }}'
    data-selected-urls='{{ selected_urls_json }}'
    data-disabled="{{ widget.attrs.disabled|yesno:'true,false' }}"
    class="relative"
    id="id_{{ widget.name }}"
    >
    <div class="relative">
        <div class="foreign-field-control {{ widget.attrs.class }} flex flex-wrap items-center gap-1 min-h-10 border border-gray-200 rounded-xl bg-white px-3 py-2 focus-within:ring-1 focus-within:ring-primary focus-within:border-primary{% if widget.attrs.disabled %} opacity-60{% endif %}">
            <div class="foreign-field-selected contents" aria-live="polite"></div>
            <input
                type="text"
                {% if widget.attrs.aria_label %}aria-label="{{ widget.attrs.aria_label }}"{% endif %}
                class="min-w-16 w-16 flex-1 border-0 bg-transparent p-0 text-sm shadow-none focus:outline-none focus:ring-0"
                {% if invalid %}aria-invalid="true"{% endif %}
                {% if widget.attrs.disabled %} disabled {% endif %}
            >
        </div>

        <div class="foreign-field-dropdown hidden absolute left-0 right-0 top-full mt-1 z-50">
            <ul class="foreign-field-results bg-white border border-gray-200 max-h-52 overflow-auto rounded-t-md shadow-lg list-none m-0 p-0 text-sm"></ul>

            <div class="bg-white border border-t-0 border-gray-200 rounded-b-md shadow-lg">
                <div data-action="create-new" tabindex="0" class="px-3 py-2 text-sm text-primary cursor-pointer hover:bg-gray-50">{% translate "Create new" %}</div>
                <div data-action="advanced-query" tabindex="0" class="px-3 py-2 text-sm text-primary cursor-pointer hover:bg-gray-50 border-t border-gray-100">{% translate "Advanced query" %}</div>
            </div>
        </div>
    </div>

</div>
