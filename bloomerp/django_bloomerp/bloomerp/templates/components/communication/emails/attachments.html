{% load i18n %}
<div bloomerp-component="reference-attachments" hidden class="shrink-0 border-b border-gray-200 px-5 py-3"
     data-can-change="true"
     data-reference-preview-url="{% url 'components_preview_file' file_id='__file_id__' %}"
     data-reference-search-url="{% url 'components_objects_references' %}"
     data-reference-upload-url="{% url 'api_assistant_file_upload' %}">
    {% if email_attachments %}{{ email_attachments|json_script }}{% endif %}
    <input type="hidden" name="object_references" value="{}">
    <div data-reference-chips></div>
    <div data-reference-files-group hidden>
        <c-ui.dropdown.body position="left" fixed="True" width="w-80" menu_class="max-h-80 overflow-y-auto">
            <c-slot name="trigger_html">
                <button type="button" class="badge badge-secondary gap-2" x-ref="trigger"
                        data-reference-files-trigger aria-haspopup="true" :aria-expanded="open.toString()"
                        @click="open = !open; if (open) $nextTick(() => resolvePlacement())">
                    <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
                    <span data-reference-files-count></span>
                    <i class="fa-solid fa-chevron-down text-xs" aria-hidden="true"></i>
                </button>
            </c-slot>
            <div data-reference-file-list></div>
        </c-ui.dropdown.body>
    </div>
</div>
