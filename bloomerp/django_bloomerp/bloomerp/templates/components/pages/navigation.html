{% load i18n %}
{% url 'pages_model' as pages_url %}
<nav aria-label="{% translate 'Pages navigation' %}">
    <a href="{{ pages_url }}?new=1" data-pages-link data-page-new class="mb-4 flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium hover:bg-gray-100 dark:hover:bg-zinc-800">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>{% translate 'New page' %}
    </a>
    {% for label, section_pages in page_sections %}
    <section class="mb-5">
        <h2 class="mb-2 px-3 text-xs font-semibold text-gray-500 dark:text-zinc-400">{{ label }}</h2>
        <ul class="space-y-1">
            {% for item in section_pages %}
            <li><a href="{{ item.get_absolute_url }}" data-pages-link data-page-id="{{ item.pk }}"
                   {% if item.pk == page.pk %}aria-current="page"{% endif %}
                   class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm hover:bg-gray-100 dark:hover:bg-zinc-800 {% if item.pk == page.pk %}bg-gray-100 font-medium dark:bg-zinc-800{% endif %}">
                <i class="fa-regular fa-file-lines shrink-0 text-gray-500" aria-hidden="true"></i><span class="truncate">{{ item }}</span>
            </a></li>
            {% empty %}<li class="px-3 text-xs text-gray-400">{% translate 'No pages yet' %}</li>{% endfor %}
        </ul>
    </section>
    {% endfor %}
</nav>
