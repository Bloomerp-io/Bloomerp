{% if submenu %}
    <c-ui.dropdown.submenu :text="group_name" :icon="group_icon">
        {% for item in items %}{{ item }}{% endfor %}
    </c-ui.dropdown.submenu>
{% else %}
    <c-ui.dropdown.body
        :trigger_text="group_label"
        :trigger_icon_class="group_icon"
        :trigger_aria_label="group_name"
        trigger_button_class="{% if selection_only or action_context.surface == 'dataview_item' %}btn-ghost{% else %}btn-secondary{% endif %}"
        :trigger_size="group_button_size"
        trigger_class="{% if dataview_group and not selection_only %}w-full sm:w-auto{% endif %}"
        wrapper_class="{% if dataview_group and not selection_only %}w-full sm:w-auto{% endif %}"
        direction="{% if selection_only %}up{% else %}down{% endif %}"
        :fixed="True"
        size="sm"
    >
        {% for item in items %}{{ item }}{% endfor %}
    </c-ui.dropdown.body>
{% endif %}
