{% load i18n %}
{% load bloomerp %}

{% for event in events %}
<button
    type="button"
    class="calendar-event block w-full rounded-xl border px-2 py-1 text-left text-xs shadow-xs transition-opacity hover:opacity-80 {{ event.color_classes }} {% if calendar_view_mode == 'day' or calendar_view_mode == 'week' %}{% if not event.all_day %}absolute left-1 right-1 z-10 overflow-hidden{% endif %}{% endif %}"
    {% if calendar_view_mode == 'day' or calendar_view_mode == 'week' %}{% if not event.all_day %}style="top: calc({{ event.start_minute }} * 5rem / 60); height: max(1.75rem, calc({{ event.duration_minutes }} * 5rem / 60));"{% endif %}{% endif %}
    title="{{ event.object }}"
    data-calendar-unit="{{ calendar_unit }}"
    data-calendar-event
    data-calendar-start="{{ event.start_ms }}"
    data-calendar-end="{{ event.end_ms }}"
    data-calendar-can-edit-start="{{ event.can_edit_start|yesno:'true,false' }}"
    data-calendar-can-edit-end="{{ event.can_edit_end|yesno:'true,false' }}"
    draggable="{{ event.can_move|yesno:'true,false' }}"
    data-detail-url="{{ event.object.get_absolute_url }}"
    data-object-id="{{ event.object.pk }}"
    data-object-string="{{ event.object }}"
    bloomerp-component="calendar-cell"
>
    {% if event.can_edit_start %}
    <span class="absolute {% if calendar_view_mode == 'day' or calendar_view_mode == 'week' %}inset-x-0 top-0 h-2 cursor-ns-resize{% else %}inset-y-0 left-0 w-2 cursor-ew-resize{% endif %}" data-calendar-resize-start aria-hidden="true"></span>
    {% endif %}
    {% if event.can_edit_end %}
    <span class="absolute {% if calendar_view_mode == 'day' or calendar_view_mode == 'week' %}inset-x-0 bottom-0 h-2 cursor-ns-resize{% else %}inset-y-0 right-0 w-2 cursor-ew-resize{% endif %}" data-calendar-resize-end aria-hidden="true"></span>
    {% endif %}
    <span class="flex min-w-0 items-center gap-1">
        {% if event.start_time %}<span class="shrink-0 font-medium">{{ event.start_time|time:"H:i" }}</span>{% endif %}
        <span class="truncate font-medium">{{ event.object }}</span>
    </span>
    {% if fields %}
    <span class="mt-0.5 block truncate opacity-75">
        {% for field in fields %}
            {% render_dataview_value object=event.object application_field=field user=request.user row_index=forloop.parentloop.counter0 column_index=forloop.counter0 url=event.object.get_absolute_url split_view_enabled=preference.split_view_enabled %}{% if not forloop.last %} · {% endif %}
        {% endfor %}
    </span>
    {% endif %}
</button>
{% endfor %}

{% if calendar_has_more %}
<button
    type="button"
    class="btn btn-sm mt-1 w-full border-gray-200 bg-base text-dark"
    data-calendar-unit="{{ calendar_unit }}"
    data-calendar-load-more
    bloomerp-component="calendar-cell"
    hx-get="{% url 'components_dataview_renderer_operation' content_type_id=content_type_id preference_id=preference.pk action='unit' %}{% if calendar_page_querystring %}?{{ calendar_page_querystring }}&{% else %}?{% endif %}calendar_view_mode={{ calendar_view_mode }}&calendar_unit={{ calendar_unit|urlencode }}&calendar_unit_offset={{ calendar_next_unit_offset }}"
    hx-target="this"
    hx-swap="outerHTML"
>
    {% blocktrans %}Load more{% endblocktrans %}
</button>
{% endif %}
