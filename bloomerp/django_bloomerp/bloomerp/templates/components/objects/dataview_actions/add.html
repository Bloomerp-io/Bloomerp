{% load i18n %}
{% if create_component_url %}
<div class="w-full sm:w-auto" data-data-view-button="{{ action.id }}">
    <c-ui.shortcut_tooltip position="bottom" action="click" shortcut="{{ action.shortcut }}">
        <button
            class="btn btn-sm btn-secondary w-full justify-center sm:w-auto"
            data-dataview-add-button="true"
            data-dataview-create-button="true"
            data-modal-id="create-object-modal"
            data-create-url="{{ create_component_url }}"
            data-target="#create-object-modal-body"
        >
            <i class="fa fa-plus"></i>
            <span>{% translate "Add" %}</span>
        </button>
    </c-ui.shortcut_tooltip>
</div>
{% endif %}
