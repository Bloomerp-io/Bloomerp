{% load i18n %}

<div class="w-full sm:w-auto" data-data-view-button="{{ action.id }}"{% if action.forward_dataview_context != False %} data-dataview-action="true"{% endif %}>
    {% if action.shortcut and not selection_only %}
        <c-ui.shortcut_tooltip position="bottom" action="click" shortcut="{{ action.shortcut }}">
            {{ action_markup }}
        </c-ui.shortcut_tooltip>
    {% else %}
        {{ action_markup }}
    {% endif %}
</div>
