{% load i18n %}

<div class="w-full sm:w-auto" data-data-view-button="{{ action.id }}" data-dataview-action="true">
    {% if action.shortcut %}
        <c-ui.shortcut_tooltip position="bottom" action="click" shortcut="{{ action.shortcut }}">
            {{ action_markup }}
        </c-ui.shortcut_tooltip>
    {% else %}
        {{ action_markup }}
    {% endif %}
</div>
