{% load i18n %}

<div class="max-h-60 overflow-y-auto" data-tutorial-action-phase="{{ phase }}">
    <table class="table table-sm table-fixed">
        <caption class="pb-2 text-left text-sm font-medium text-slate-700 dark:text-zinc-300">{{ title }}</caption>
        <thead>
            <tr>
                <th scope="col" class="w-28 px-1 pb-2 font-medium sm:w-36">{% translate 'Action' %}</th>
                <th scope="col" class="px-1 pb-2 font-medium">{% translate 'Target' %}</th>
                <th scope="col" class="w-24"><span class="sr-only">{% translate 'Row actions' %}</span></th>
            </tr>
        </thead>
        <tbody data-tutorial-action-rows></tbody>
        <tfoot>
            <tr>
                <td colspan="3" class="border-t border-gray-200 pt-1 dark:border-zinc-700">
                    <button type="button" data-tutorial-interaction="add-action" aria-label="{{ add_label }}"
                        class="flex w-full cursor-pointer items-center gap-2 rounded px-1 py-1.5 text-left text-xs font-medium text-gray-600 hover:bg-gray-100 dark:text-zinc-400 dark:hover:bg-zinc-800">
                        <i class="fa-solid fa-plus" aria-hidden="true"></i>
                        {% translate 'Add action' %}
                    </button>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
