{% extends "views/base.html" %}
{% load i18n %}
{% block body %}
<main class="m-3 flex h-[calc(100vh-1.5rem)] flex-col overflow-hidden rounded-xl border border-gray-200 bg-white p-4">
    {% if error %}
    <p role="alert" class="text-sm">{{ error }}</p>
    {% else %}
    <div class="min-h-0 flex-1" hx-get="{{ signing_url }}" hx-trigger="load" hx-swap="innerHTML">
        <p role="status" class="text-sm text-muted">{% trans 'Loading signing request…' %}</p>
    </div>
    {% endif %}
</main>
{% include "snippets/vite_bundle.html" %}
{% endblock body %}
