{% load i18n %}
{% translate "Clone row" as clone_row_label %}
{% translate "Remove row" as remove_row_label %}
{% translate "View row" as view_row_label %}

<div class="flex items-center justify-end gap-1">
    {% if not pending %}
    <c-ui.tooltip text="{{ clone_row_label }}" position="top">
        <button type="button" class="icon-button" data-one-to-many-clone-row aria-label="{{ clone_row_label }}" {% if not can_edit %}disabled{% endif %}>
            <i class="fa-solid fa-clone" aria-hidden="true"></i>
        </button>
    </c-ui.tooltip>
    {% endif %}
    <c-ui.tooltip text="{{ remove_row_label }}" position="top">
        <button type="button" class="icon-button" data-one-to-many-delete-row aria-label="{{ remove_row_label }}" {% if not can_edit %}disabled{% endif %}>
            <i class="fa-solid fa-trash" aria-hidden="true"></i>
        </button>
    </c-ui.tooltip>
    <a
        class="icon-button {% if not row_id %}hidden{% endif %}"
        {% if detail_url %}href="{{ detail_url }}"{% endif %}
        data-one-to-many-view-row
        data-object-id="{{ row_id|default:'' }}"
        data-detail-url="{{ detail_url|default:'' }}"
        aria-label="{{ view_row_label }}"
    >
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    </a>
</div>
