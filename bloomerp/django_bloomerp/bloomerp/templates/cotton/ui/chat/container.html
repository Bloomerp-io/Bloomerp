{% comment %}
Shared scrollable chat timeline. Parameters: class, label. Slot: messages.
Additional HTML attributes are forwarded to the timeline.
{% endcomment %}
{% load i18n %}
<c-vars class="" label="" />
{% translate "Messages" as default_label %}
<div class="im-messages {{ class }}" role="log" aria-label="{{ label|default:default_label }}" {{ attrs }}>{{ slot }}</div>
