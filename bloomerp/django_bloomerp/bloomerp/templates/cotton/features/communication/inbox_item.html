{% load i18n %}
<div 
    bloomerp-component="inbox-item"
    data-inbox-item-id="{{ item.id }}"
    id="inbox-item-{{ item.id }}"

    {% if hx_swap_oob %}
        hx-swap-oob="true"
    {% endif %}
>
    <button id="inbox-item-button-{{ item.id }}" type="button" data-inbox-row-button aria-keyshortcuts="Enter Space" class="w-full p-2 text-left hover:bg-gray-50 focus-visible:outline-none">
        <div class="flex items-center gap-4">
            <span class="mt-0.5 inline-flex size-5 items-center justify-center rounded-md bg-primary-500 text-[0.7rem] text-white">
                <i class="{{ item.icon }}"></i>
            </span>
            <span class="min-w-0 flex-1">
                <span class="flex flex-col">
                    <span class="{% if not item.is_read %} font-bold {% endif %}">{{ item.actor }}</span>
                    <div class="flex items-center justify-between gap-4">
                        <span class="truncate text-sm {% if not item.is_read %}font-bold{% endif %}">{% translate item.title %}</span>
                        <span class="text-sm text-gray-600">{{ item.datetime_received|date:request.user.datetime_view_preference }}</span>
                    </div>
                </span>
                {% if item.snippet %}
                <span class="mt-3 flex items-center gap-2 text-sm text-gray-600">
                    <span class="truncate">{% translate item.snippet %}</span>
                </span>
                {% endif %}
            </span>
        </div>
    </button>
</div>
