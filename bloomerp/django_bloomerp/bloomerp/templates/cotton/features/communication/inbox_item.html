{% load i18n %}
<div 
    bloomerp-component="inbox-item"
    data-inbox-item-id="{{ item.id }}"
    id="inbox-item-{{ item.id }}"

    {% if hx_swap_oob %}
        hx-swap-oob="true"
    {% endif %}
>
    <button id="inbox-item-button-{{ item.id }}" type="button" data-inbox-row-button aria-keyshortcuts="Enter Space"
        class="flex w-full items-start gap-2 px-3 py-2 text-left hover:bg-gray-50 focus-visible:outline-none">
        {% if item.icon %}
            <span class="inline-flex size-5 shrink-0 items-center justify-center rounded-md text-xs {% if item.is_read %}bg-primary-50 text-primary-700{% else %}bg-primary-500 text-white{% endif %}" aria-hidden="true">
                <i class="{{ item.icon }}"></i>
            </span>
        {% endif %}
        <span class="min-w-0 flex-1">
            <span class="flex min-w-0 items-center justify-between gap-2">
                <span class="min-w-0 truncate text-sm leading-5 text-gray-900 {% if item.is_read %}font-normal{% else %}font-bold{% endif %}">
                    {% if item.actor %}{{ item.actor }}{% else %}{% translate item.title %}{% endif %}
                </span>
                {% if item.datetime_received %}
                    <time datetime="{{ item.datetime_received|date:'c' }}" class="shrink-0 whitespace-nowrap text-xs text-gray-500">
                        {{ item.datetime_received|date:request.user.datetime_view_preference }}
                    </time>
                {% endif %}
            </span>
            {% if item.actor %}
                <span class="block truncate text-sm leading-5 text-gray-900 {% if item.is_read %}font-normal{% else %}font-bold{% endif %}">{% translate item.title %}</span>
            {% endif %}
            {% if item.snippet %}
                <span class="block truncate text-sm leading-4 text-gray-600">{% translate item.snippet %}</span>
            {% endif %}
        </span>
    </button>
</div>
