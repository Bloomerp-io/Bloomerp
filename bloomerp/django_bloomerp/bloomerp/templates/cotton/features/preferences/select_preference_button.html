{% load i18n %}
<c-ui.dropdown.body
    trigger_text="{% if not icon_only %}{{ selected_preference_name|default:'Preference' }}{% endif %}"
    trigger_icon_class="{{ trigger_icon_class|default:'fa fa-bookmark' }}"
    trigger_button_class="{{ trigger_button_class|default:'btn-secondary' }}"
    trigger_class="{{ trigger_class|default:'w-full justify-center gap-2 sm:w-auto' }}"
    trigger_aria_label="{{ trigger_aria_label }}"
    wrapper_class="{{ wrapper_class|default:'w-full sm:w-auto' }}"
    position="right"
    size="sm"
    width="w-80"
    fixed=True
    menu_class="max-h-[calc(100vh-6rem)] max-w-[calc(100vw-1rem)] overflow-auto"
>
    <div
        id="select-preference-dropdown-{{ model }}"
        hx-get="{% url 'components_select_preference' model=model%}?{% if args %}{% for key, value in args.items %}{{ key }}={{ value }}&{% endfor %}{% endif %}"
        hx-trigger="revealed once"
        hx-target="this"
        hx-swap="innerHTML"
        hx-push-url="false"
    >
        <div class="px-4 py-3 text-sm text-gray-500">
            {% translate "Loading preferences..." %}
        </div>
    </div>
</c-ui.dropdown.body>
