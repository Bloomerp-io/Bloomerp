{# hide_filters="true" hides applied filters while retaining the filter action. #}
{% url 'components_dataview' content_type_id=content_type_id as base_url %}
<div
	hx-get="{{ base_url }}{% if query_params %}{% for key, value in query_params.items %}{% if forloop.first %}?{% else %}&{% endif %}{{ key|urlencode }}={{ value|urlencode }}{% endfor %}{% endif %}{% if component_id %}{% if query_params %}&{% else %}?{% endif %}_component_id={{ component_id }}{% endif %}{% if args %}{% for key, value in args.items %}{% if query_params or component_id or not forloop.first %}&{% else %}?{% endif %}_arg_{{ key|urlencode }}={{ value|urlencode }}{% endfor %}{% endif %}{% if request.GET.urlencode %}{% if query_params or component_id or args %}&{% else %}?{% endif %}{{ request.GET.urlencode }}{% endif %}{% if hide_filters|stringformat:"s"|lower == "true" %}{% if query_params or component_id or args or request.GET.urlencode %}&{% else %}?{% endif %}_arg_hide_filters=true{% endif %}"
	hx-trigger="load"
	hx-target="this"
	hx-swap="outerHTML"
	hx-push-url="false"
	{% if sync_url or request_context_id %}hx-headers='{% templatetag openbrace %}{% if sync_url %}"X-Bloomerp-Sync-Url": "true"{% endif %}{% if request_context_id %}{% if sync_url %}, {% endif %}"X-Bloomerp-Context": "{{ request_context_id }}"{% endif %}{% templatetag closebrace %}'{% endif %}
	
>
</div>
