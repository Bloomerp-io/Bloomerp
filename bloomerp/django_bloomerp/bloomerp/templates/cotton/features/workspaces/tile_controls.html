{% load i18n %}
<div class="flex items-center gap-2">
    {% if description %}
    <c-ui.tooltip :text="description" position="top">
        <i class="fa fa-info text-xs"></i>
    </c-ui.tooltip>
    {% endif %}
    <button type="button" data-tile-expand class="text-slate-500 hover:text-slate-900"
            title="{% translate 'Expand tile' %}" aria-label="{% translate 'Expand tile' %}">
        <i class="fa fa-expand text-xs" aria-hidden="true"></i>
    </button>
</div>
