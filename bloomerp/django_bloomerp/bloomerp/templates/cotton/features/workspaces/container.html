{% load i18n %}
<c-features.layout.container 
    :component_name="ts_container_component"
    :layout="layout"
    :can_change="can_change"
    :change_context="change_context"
    :init_edit="init_edit"
    :extra_attrs="layout_container_extra_attrs"
    >
    <c-slot name="buttons_left">
        <!--Filters-->
        <div class="w-full sm:w-auto">
            <c-ui.shortcut_tooltip 
                position="bottom" 
                shortcut="mod+1"
                focus_target="select"
                >
                <c-ui.dropdown.body 
                    trigger_text="Filter"
                    trigger_icon_class="fa fa-filter"
                    trigger_button_class="btn-secondary"
                    trigger_class="w-full justify-center gap-2"
                    wrapper_class="w-full"
                    size="sm"
                    width="w-128"
                    position="left"
                    fixed=True
                    menu_class="max-h-[calc(100vh-6rem)] max-w-[calc(100vw-1rem)] overflow-auto"
                    >
                    <c-features.filters.container scope="workspace" id="{{ workspace.id }}"/>
                </c-ui.dropdown.body>
            </c-ui.shortcut_tooltip>
        </div>
        <!--End filters-->
    </c-slot>
    
    <c-slot name="buttons_right">
        {% if show_module_selector %}
            <button
                type="button"
                class="btn btn-secondary btn-sm"
                hx-get="{% url 'bloomerp_home_view' %}?modules=1"
                hx-target="#main-content"
                hx-push-url="true"
                hx-swap="innerHTML"
            >
                <i class="fa fa-puzzle-piece"></i>
                {% blocktrans %}Select module{% endblocktrans %}
            </button>
        {% endif %}

        <c-ui.shortcut_tooltip position="bottom" shortcut="mod+6">
            <c-features.preferences.select_preference_button
                model="Workspace"
                :args="{
                    'module_id': '{{ module_id }}',
                }"
                selected_preference_name="{{ workspace.name }}"
            />
        </c-ui.shortcut_tooltip>

        <button 
            class="btn btn-secondary btn-sm hidden"
            data-create-tile-btn
            >
            <i class="fa fa-add"></i>
            {% blocktrans %}Create tile{% endblocktrans %}
        </button>
    </c-slot>
</c-features.layout.container>
