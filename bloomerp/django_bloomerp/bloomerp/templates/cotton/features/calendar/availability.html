{% load i18n %}
<div bloomerp-component="calendar-availability" data-url="{% url 'components_calendar_availability' %}" class="contents">
        <aside bloomerp-component="resizable-div" data-id="calendar-event-availability" data-storage="local" data-start-width="340px" data-min-width="240" data-min-remaining-width="440" class="relative min-w-0 shrink-0 xl:border-l xl:border-gray-200">
            <div data-resizable-div-panel class="space-y-3 p-6">
                <div class="flex items-center justify-between gap-2"><span class="text-sm font-medium">{% translate 'Availability' %}</span><span data-availability-date class="text-xs text-gray-500"></span></div>
                <div data-availability-grid class="max-h-[560px] overflow-auto" role="region" aria-label="{% translate 'Attendee availability' %}"></div>
                <p class="text-xs text-gray-500">{% translate 'Click a time to schedule an hour. Shaded cells are busy; ? means availability is unavailable.' %}</p>
            </div>
        </aside>
</div>
