{% load i18n %}
{% load crispy_forms_tags %}

{% if inbox %}
{% include "components/communication/inbox.html" %}
{% else %}

<c-ui.center_page_element class="" icon="fa fa-envelope" title="{% translate "Create Inbox" %}"
    text="{% translate "Create an inbox or select one that has been shared with you." %}">
    <div id="create-inbox-panel" class="flex flex-col items-center gap-4">

        <c-features.preferences.select_preference_button
            model="Inbox"
            selected_preference_name="{% translate "Select shared inbox" %}"
            trigger_icon_class="fa fa-inbox"
        />

        <button class="btn btn-primary" hx-post="{% url 'components_create_inbox' %}" hx-target="this"
            hx-swap="innerHTML" hx-vals='{"csrfmiddlewaretoken": "{{ csrf_token }}", "create_default": "true"}'>{% translate "Create default" %}</button>

        <button class="btn btn-secondary" type="button" hx-get="{% url 'components_create_inbox' %}"
            hx-target="#create-custom-inbox-modal-body" bloomerp-open-modal="create-custom-inbox-modal"
            hx-swap="innerHTML" hx-animation>
            {% translate "Create custom" %}
        </button>
    </div>
</c-ui.center_page_element>
{% endif %}

<c-ui.modal id="create-custom-inbox-modal" />
<div id="inbox-message-target"></div>
