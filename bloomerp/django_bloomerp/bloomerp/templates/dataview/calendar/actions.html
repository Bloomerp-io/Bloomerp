{% load bloomerp %}
{% if object_actions %}
<div class="ml-auto shrink-0" data-calendar-object-actions data-no-row-click>
    {% for action in object_actions %}
        {% render_object_action action=action object=event.object request=request content_type_id=content_type_id dataview=dataview_action_context %}
    {% endfor %}
</div>
{% endif %}
