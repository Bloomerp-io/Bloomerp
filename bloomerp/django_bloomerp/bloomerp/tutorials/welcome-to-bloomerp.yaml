          selector: '#global-search-btn'
          allow_interaction: false
        tooltip_highlight_id: 08d12acc-5f30-4151-ae6a-ce42349d851d
        advance_highlight_id: 08d12acc-5f30-4151-ae6a-ce42349d851d
