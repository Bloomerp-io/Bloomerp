  name: Welcome to BloomERP
  description: '<p class="text-md mb-2 last:mb-0" dir="ltr"><span style="white-space:
    pre-wrap;">Welcome to BloomERP. This short tour starts on Home and shows you how
    to find your way around. You’ll learn to search for pages and records, review
    your Inbox, and open Pages, BloomAI Agent, and Chat from the workspace toolbar.</span></p>'
  is_active: true
  available_to_all: true
  user_filter: []
  topics: []
