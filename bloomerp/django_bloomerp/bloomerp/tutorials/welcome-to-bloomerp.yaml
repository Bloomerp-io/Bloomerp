    - sequence: 6
      key: b87836628e7146319727d9b054c135ce
      name: BloomERP Pages
      text: '<p class="text-md mb-2 last:mb-0" dir="ltr"><b><strong style="white-space:
        pre-wrap;">Pages</strong></b><span style="white-space: pre-wrap;"> is a scratchpad
        for notes you want to keep while you work.</span></p><ul class="list-disc
        list-inside pl-4"><li value="1"><b><strong style="white-space: pre-wrap;">Try
        it.</strong></b><span style="white-space: pre-wrap;"> Open Pages, choose New
        page, and jot down </span><i><em style="white-space: pre-wrap;">Ask the team
        which report needs updating.</em></i></li><li value="2"><b><strong style="white-space:
        pre-wrap;">What to expect.</strong></b><span style="white-space: pre-wrap;">
        The new page opens in the scratchpad while Home stays in place. Use Page history
        → Recents to find it again.</span></li></ul><p class="text-md mb-2 last:mb-0"><br></p>'
      size: small
      destination_route: bloomerp_home_view
      destination_kwargs: {}
      interaction:
