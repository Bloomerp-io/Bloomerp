      name: BloomERP Sidebar
      text: '<p class="text-md mb-2 last:mb-0" dir="ltr"><span style="white-space:
        pre-wrap;">Use the sidebar to open a favorite section. Select Home to return
        to this workspace, where you can open any module available to you.</span></p><p
        class="text-md mb-2 last:mb-0" dir="ltr"><span style="white-space: pre-wrap;">Everyone
        in BloomERP can configure their own sidebar. You can add items to your sidebar
        by dragging and dropping any link onto it, after which you can re-organize
        when necessary.</span></p>'
      size: medium
      destination_route: bloomerp_home_view
      destination_kwargs: {}
      interaction:
