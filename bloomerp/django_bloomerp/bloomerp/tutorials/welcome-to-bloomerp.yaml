    - sequence: 3
      key: 7e8991441b4c4ce2a1f53c7cc30e7ca1
      name: BloomERP Search Bar
      text: '<p class="text-md mb-2 last:mb-0" dir="ltr"><span style="white-space:
        pre-wrap;">Open </span><b><strong style="white-space: pre-wrap;">Search</strong></b><span
        style="white-space: pre-wrap;"> in the sidebar, or press </span><b><strong
        style="white-space: pre-wrap;">⌘K</strong></b><span style="white-space: pre-wrap;">
        on Mac.</span></p><ul class="list-disc list-inside pl-4"><li value="1"><b><strong
        style="white-space: pre-wrap;">Find a page.</strong></b><span style="white-space:
        pre-wrap;"> Type </span><code style="white-space: pre-wrap;"><span>&gt;Tutorials</span></code><span
        style="white-space: pre-wrap;">. Look under Routes for the Tutorials page.</span></li><li
        value="2"><b><strong style="white-space: pre-wrap;">Find a record.</strong></b><span
        style="white-space: pre-wrap;"> Type </span><i><em style="white-space: pre-wrap;">Welcome
        to BloomERP</em></i><span style="white-space: pre-wrap;"> without the </span><code
        style="white-space: pre-wrap;"><span>&gt;</span></code><span style="white-space:
        pre-wrap;">. Matching records appear under their model. Choose the result
        you want to open.</span></li></ul><p class="text-md mb-2 last:mb-0"><br></p>'
      size: medium
      destination_route: bloomerp_home_view
      destination_kwargs: {}
      interaction:
        highlights:
        - id: 08d12acc-5f30-4151-ae6a-ce42349d851d
