      name: Welcome!
      text: '<p class="text-md mb-2 last:mb-0" dir="ltr"><span style="white-space:
        pre-wrap;">Welcome to BloomERP, the </span><b><strong style="white-space:
        pre-wrap;">AI-native platform</strong></b><span style="white-space: pre-wrap;">
        to help you manage your business efficiently. This tutorial will guide you
        through the basics of how to navigate your way through BloomERP.</span></p>'
