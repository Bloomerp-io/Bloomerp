    - sequence: 7
      key: 5b92afd1252c4930b5b03baec6ebac76
      name: BloomERP Agents
      text: '<p class="text-md mb-2 last:mb-0" dir="ltr"><b><strong style="white-space:
        pre-wrap;">BloomAI Agent</strong></b><span style="white-space: pre-wrap;">
        can answer questions or help with work using the access your account already
        has.</span></p><ul class="list-disc list-inside pl-4"><li value="1"><b><strong
        style="white-space: pre-wrap;">Try it.</strong></b><span style="white-space:
        pre-wrap;"> Open Agent, choose an available agent, and enter </span><i><em
        style="white-space: pre-wrap;">What can you help me do in BloomERP? Give me
        two examples without changing any records.</em></i></li><li value="2"><b><strong
        style="white-space: pre-wrap;">What to expect.</strong></b><span style="white-space:
        pre-wrap;"> Read the response in the BloomAI panel. Ask a follow-up there
        if you need more detail.</span></li></ul><p class="text-md mb-2 last:mb-0"><br></p>'
      size: medium
