      name: BloomERP Communication
      text: '<p class="text-md mb-2 last:mb-0" dir="ltr"><span style="white-space:
        pre-wrap;">Open </span><b><strong style="white-space: pre-wrap;">Chat</strong></b><span
        style="white-space: pre-wrap;"> to see your messages and keep work conversations
        in BloomERP.</span></p><ul class="list-disc list-inside pl-4"><li value="1"><b><strong
        style="white-space: pre-wrap;">Resume.</strong></b><span style="white-space:
        pre-wrap;"> Use Search messages and people to find a thread, then select it
        to reopen the conversation. Use Unread only to focus on new messages.</span></li><li
        value="2"><b><strong style="white-space: pre-wrap;">Start.</strong></b><span
        style="white-space: pre-wrap;"> Choose New conversation, search for a teammate,
        and select their name. A conversation opens where you can write your first
        message.</span></li></ul><p class="text-md mb-2 last:mb-0"><br></p>'
