    - sequence: 4
      key: 279ecf1e7c844b37aa90545a063c172b
      name: BloomERP Inbox
      text: '<p class="text-md mb-2 last:mb-0" dir="ltr"><b><strong style="white-space:
        pre-wrap;">Inbox</strong></b><span style="white-space: pre-wrap;"> brings
        together notifications, messages, and connected email. The sidebar badge shows
        how many items are unread.</span></p><ul class="list-disc list-inside pl-4"><li
        value="1"><b><strong style="white-space: pre-wrap;">Review.</strong></b><span
        style="white-space: pre-wrap;"> Start in All, or switch to Notifications or
        Messages. Rows show the sender, subject, and arrival time. Select a row to
        read it.</span></li><li value="2"><b><strong style="white-space: pre-wrap;">Find
        something.</strong></b><span style="white-space: pre-wrap;"> In Search inbox,
        try a word from a subject, such as </span><i><em style="white-space: pre-wrap;">welcome</em></i><span
        style="white-space: pre-wrap;">. Check the resulting list, or clear the search
        to return to the folder.</span></li></ul><p class="text-md mb-2 last:mb-0"><br></p>'
      size: medium
      destination_route: bloomerp_home_view
      destination_kwargs: {}
      interaction:
        highlights:
