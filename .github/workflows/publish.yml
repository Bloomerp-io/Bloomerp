name: Publish Bloomerp Package

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: bloomerp/django_bloomerp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Determine package version
        id: version
        working-directory: .
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          import tomllib

          pyproject_path = Path("bloomerp/django_bloomerp/pyproject.toml")
          source = pyproject_path.read_text(encoding="utf-8")
          current = tomllib.loads(source)
          project = current["project"]["name"]
          version = current["project"]["version"]
          previous_version = None

          before = os.environ.get("BEFORE_SHA", "")
          if before and before != "0" * 40:
              previous_source = subprocess.run(
                  ["git", "show", f"{before}:{pyproject_path.as_posix()}"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if previous_source.returncode == 0:
                  previous_version = tomllib.loads(previous_source.stdout)["project"]["version"]

          needs_commit = "false"
          if previous_version == version:
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
              if not match:
                  raise ValueError(f"Cannot increment non-semantic package version: {version}")
              major, minor, patch = map(int, match.groups())
              version = f"{major}.{minor}.{patch + 1}"

              lines = source.splitlines(keepends=True)
              in_project = False
              replaced = False
              for index, line in enumerate(lines):
                  stripped = line.strip()
                  if stripped == "[project]":
                      in_project = True
                      continue
                  if in_project and stripped.startswith("["):
                      break
                  if in_project and re.match(r"^version\s*=", stripped):
                      newline = "\n" if line.endswith("\n") else ""
                      lines[index] = f'version = "{version}"{newline}'
                      replaced = True
                      break
              if not replaced:
                  raise ValueError("Could not find project.version in pyproject.toml")
              pyproject_path.write_text("".join(lines), encoding="utf-8")
              needs_commit = "true"

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              fh.write(f"project={project}\n")
              fh.write(f"version={version}\n")
              fh.write(f"needs_commit={needs_commit}\n")
          PY
        env:
          BEFORE_SHA: ${{ github.event.before }}

      - name: Check whether this version already exists on PyPI
        id: pypi
        working-directory: .
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path
          import os

          project = os.environ["PROJECT_NAME"]
          version = os.environ["PROJECT_VERSION"]
          url = f"https://pypi.org/pypi/{project}/{version}/json"

          exists = "false"
          try:
              with urllib.request.urlopen(url) as response:
                  if response.status == 200:
                      json.load(response)
                      exists = "true"
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              fh.write(f"exists={exists}\n")
          PY
        env:
          PROJECT_NAME: ${{ steps.version.outputs.project }}
          PROJECT_VERSION: ${{ steps.version.outputs.version }}

      - name: Stop when version is already published
        if: steps.pypi.outputs.exists == 'true'
        run: |
          echo "Package version ${{ steps.version.outputs.version }} already exists on PyPI. Skipping publish."

      - name: Commit and push automatic patch version
        if: steps.pypi.outputs.exists != 'true' && steps.version.outputs.needs_commit == 'true'
        working-directory: .
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin main

          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "main advanced after this workflow started; a newer workflow run will publish it."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloomerp/django_bloomerp/pyproject.toml
          git commit -m "chore: bump package version to ${PROJECT_VERSION}"
          git push origin HEAD:main

      - name: Build distribution
        if: steps.pypi.outputs.exists != 'true'
        working-directory: .
        run: |
          cp README.md bloomerp/django_bloomerp/README.md
          cd bloomerp/django_bloomerp
          cd bloomerp/static_src
          npm install
          npm run build
          cd ../..
          python -m build

      - name: Check distribution metadata
        if: steps.pypi.outputs.exists != 'true'
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          packages-dir: bloomerp/django_bloomerp/dist
