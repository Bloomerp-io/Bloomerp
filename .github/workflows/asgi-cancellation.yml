name: ASGI cancellation regression

on:
  pull_request:
    paths:
      - bloomerp/django_bloomerp/pyproject.toml
      - bloomerp/django_bloomerp/uv.lock
      - bloomerp/django_bloomerp/bloomerp/tests/utils/test_asgi_cancellation.py
      - .github/workflows/asgi-cancellation.yml
  push:
    branches: [main]
    paths:
      - bloomerp/django_bloomerp/pyproject.toml
      - bloomerp/django_bloomerp/uv.lock
      - bloomerp/django_bloomerp/bloomerp/tests/utils/test_asgi_cancellation.py
      - .github/workflows/asgi-cancellation.yml

permissions:
  contents: read

jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: bloomerp/django_bloomerp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the declared asgiref dependency
        run: |
          python -m pip install "$(python -c 'import tomllib; print(next(dependency for dependency in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"] if dependency.startswith("asgiref==")))')"
      - name: Verify cancellation keeps the event loop responsive
        run: python bloomerp/tests/utils/test_asgi_cancellation.py
